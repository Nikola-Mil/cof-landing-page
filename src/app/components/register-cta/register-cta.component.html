<section class="register section section--dark" id="register">
  <div class="container register__inner">
    <span class="section__eyebrow register__eyebrow">Registration</span>
    <h2>Reserve Your Seat in Podgorica</h2>
    <p>
      Registration is required to attend. Join economists, policymakers and reformers for two days of
      conversation on Montenegro's European future — {{ info.dateLong }}, {{ info.venue }}.
    </p>
    <a class="btn btn--primary register__btn" [href]="info.registerUrl" target="_blank" rel="noopener noreferrer">
      Register Now
      <span class="material-icons-outlined">arrow_forward</span>
    </a>
  </div>
</section>
