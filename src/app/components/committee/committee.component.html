<section class="committee section section--alt" id="committee">
  <div class="container">
    <div class="section__title">
      <span class="section__eyebrow">{{ i18n.ui().committee.eyebrow }}</span>
      <h2>{{ i18n.ui().committee.title }}</h2>
      <p>{{ i18n.ui().committee.lead }}</p>
    </div>

    <div class="committee__grid">
      @for (member of i18n.committee(); track member.name) {
        <div class="committee__card">
          @if (member.photo) {
            <span class="committee__avatar committee__avatar--photo">
              <img [src]="member.photo" [alt]="member.name" />
            </span>
          } @else {
            <span class="committee__avatar">{{ initials(member.name) }}</span>
          }
          <div>
            <h3>{{ member.name }}</h3>
            <p>{{ member.role }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
