<section class="register section section--dark" id="register">
  <div class="container register__inner">
    <span class="section__eyebrow register__eyebrow">{{ i18n.ui().register.eyebrow }}</span>
    <h2>{{ i18n.ui().register.title }}</h2>
    <p>
      {{ i18n.ui().register.leadPrefix }} {{ i18n.info().dateLong }}, {{ i18n.info().venue }}.
    </p>
    <a class="btn btn--primary register__btn" [href]="i18n.info().registerUrl" target="_blank" rel="noopener noreferrer">
      {{ i18n.ui().register.registerNow }}
      <span class="material-icons-outlined">arrow_forward</span>
    </a>
  </div>
</section>
